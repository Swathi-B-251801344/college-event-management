
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Organizer Assignments</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4efff;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 25px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 12px #ddd;
        }

        h1 {
            text-align: center;
            color: #6c3bbd;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #6c3bbd;
            color: white;
        }

        tr:nth-child(even) {
            background: #f8f5ff;
        }

        .empty {
            text-align: center;
            color: #666;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            color: #bd3b9a;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <div class="container">
        <h1>Event Organizer Assignments</h1>

        <table>
            <thead>
                <tr>
                    <th>Assignment ID</th>
                    <th>Event ID</th>
                    <th>Event Name</th>
                    <th>Organizer ID</th>
                    <th>Organizer Name</th>
                </tr>
            </thead>

            <tbody>
                <tr th:each="assignment : ${assignments}">
                    <td th:text="${assignment.id}"></td>
                    <td th:text="${assignment.eventId}"></td>
                    <td th:text="${assignment.eventName}"></td>
                    <td th:text="${assignment.organizerId}"></td>
                    <td th:text="${assignment.organizerName}"></td>
                </tr>
            </tbody>
        </table>

        <p class="empty"
           th:if="${#lists.isEmpty(assignments)}">
            No event organizer assignments found.
        </p>

        <a class="back" href="/">← Back to Home</a>
    </div>
</body>
</html>
